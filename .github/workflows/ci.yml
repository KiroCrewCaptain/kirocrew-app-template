name: CI

# Template CI for a Kiro Crew app repository. Two jobs:
#   test    the app's own tests, on every OS the manifest's `platform.os` names.
#   readme  the mechanical half of CHECKLIST.md (sections, placeholders, alt text,
#           referenced media exist and fit their budgets).
#
# Neither job boots Kiro Crew or records media: capture is a local step
# (capture/README.md), and its output is committed under docs/media/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep this list equal to app.json `platform.os`.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Kiro Crew requires Python >= 3.12, and in-gateway hooks run in the
        # gateway's own interpreter.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Validate app.json is JSON
        run: python -c "import json; json.load(open('app.json', encoding='utf-8'))"

      - name: Install pinned test dependencies
        if: hashFiles('tests/requirements.txt') != ''
        run: python -m pip install -r tests/requirements.txt

      - name: Run tests
        if: hashFiles('tests/**/*.py') != ''
        run: python -m pytest

  readme:
    name: README standard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Skipped in the template repository itself, whose README.md describes the
      # template; it runs in every app repository made from it.
      - name: Check README.md against CHECKLIST.md
        if: hashFiles('README.template.md') == ''
        run: python capture/check_readme.py README.md

      - name: Check scenes.json parses
        if: hashFiles('capture/scenes.json') != ''
        run: python -c "import json; json.load(open('capture/scenes.json', encoding='utf-8'))"
